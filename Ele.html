<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8; width=device-width">
  <title>Ele</title>
  <style>
  div{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  </style>
</head>
<body style="background-color: black;">
  <audio id="musc" src="man.m4a" loop></audio>
  <div>
    <button id="but" style="background-color: black; color: white;">.</button>
    <img onclick="ele()" id="Him" src="Man_overworld_tree.gif" style="display: none;">
  </div>
</body>
<script>
const him = document.getElementById("Him");
const musc = document.getElementById("musc");
const but = document.getElementById("but");
let dialogo = 1;

but.onclick=function(){
  alert("Ele está atrás da árvore");
  but.style.display = "none";
  him.style.display = "block";
  musc.play();
}

function ele(){
  if(dialogo==1){
    alert("Bem, tem um homem aqui");
    dialogo=2;
  }
  else if(dialogo==2){
    alert("Ele está te oferecendo algo");
    dialogo=3;
  }
  else if(dialogo==3){
    alert("O que você acha?");
    dialogo=4;
  }
  else if(dialogo==4){
    alert("Você conseguiu o ovo");
    dialogo=5;
  }
  else{
    alert("Bem, não tem um homem aqui");
    window.close();
  }
}
</script>
</html>
